services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./capp
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - uploads:/app/static
    depends_on:
      - postgres

  frontend:
    build: ./capp-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads: