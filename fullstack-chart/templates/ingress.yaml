
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fullstack-chart.fullname" . }}-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2

spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Backend API: /api/products becomes /products
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "fullstack-chart.fullname" . }}-backend-svc
                port:
                  number: {{ .Values.backend.port }}

          # Backend images: preserve /static/images/...
          - path: /()(static/.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "fullstack-chart.fullname" . }}-backend-svc
                port:
                  number: {{ .Values.backend.port }}

          # Frontend: Angular pages and assets
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "fullstack-chart.fullname" . }}-frontend-svc
                port:
                  number: {{ .Values.frontend.port }}
