apiVersion: v1
kind: Service
metadata:
  name: {{ include "fullstack-chart.fullname" . }}-frontend-svc
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: {{ .Release.Name }}