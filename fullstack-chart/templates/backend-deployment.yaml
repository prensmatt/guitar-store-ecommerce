apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fullstack-chart.fullname" . }}-backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      hostAliases:
        - ip: "192.168.49.1"
          hostnames:
            - "host.docker.internal"
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.backend.port }}
          envFrom:
            - secretRef:
                name: {{ include "fullstack-chart.fullname" . }}-secrets
          volumeMounts:
            - name: backend-images
              mountPath: {{ .Values.backend.persistence.mountPath }}
      volumes:
        - name: backend-images
          persistentVolumeClaim:
            claimName: {{ include "fullstack-chart.fullname" . }}-backend-images-pvc